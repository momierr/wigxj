[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wigxj"
version = "0.1.0"
description = "Fast Wigner 3j, 6j, 9j symbols and Clebsch-Gordan coefficients"
readme = "README.md"
license = "MIT AND LGPL-3.0-or-later"
license-files = ["LICENSE", "src/wigxj/_ext/wigxjpf/COPYING*"]
authors = [{ name = "Rodolphe Momier", email = "momier.rodolphe@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.20"]
keywords = ["wigner", "3j", "6j", "9j", "clebsch-gordan", "angular momentum", "quantum physics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/momierr/wigxj"
Issues = "https://github.com/momierr/wigxj/issues"

[tool.pytest.ini_options]
# mpmath (pulled in by sympy, used only in tests) calls a function deprecated in Python 3.15
filterwarnings = ["ignore::DeprecationWarning:mpmath.*"]

[[tool.mypy.overrides]]
# sympy ships no type information; it is only used as a reference in tests
module = ["sympy", "sympy.*"]
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wigxj = ["py.typed", "*.pyi"]

[tool.cibuildwheel]
skip = [
    "cp3*t-*", # free-threaded: wigxjpf keeps global tables, built without thread support
    "*-win32", # 32-bit Windows: no recent numpy wheels to test against
]
test-requires = ["pytest", "hypothesis", "sympy"]
test-sources = ["tests"]
test-command = "pytest tests"
test-environment = { WIGXJ_REQUIRE_C = "1" }

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[tool.pixi.pypi-dependencies]
wigxj = { path = ".", editable = true }

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
prod = { solve-group = "default" }

[tool.pixi.tasks]
build = "python setup.py build_ext --inplace"

[tool.pixi.dependencies]
setuptools = ">=84.2.1,<85"

[tool.pixi.target.linux-64.dependencies]
c-compiler = ">=2.0.0,<3"

[tool.pixi.target.osx-arm64.dependencies]
c-compiler = ">=2.0.0,<3"

[tool.pixi.feature.dev.tasks]
test = { cmd = "pytest -v", depends-on = ["build"] }
lint = "ruff check ."
format-check = "ruff format --check ."
typecheck = "mypy src tests"

[tool.pixi.feature.dev.dependencies]
ruff = ">=0.17.1,<0.18"
pre-commit = ">=4.7.0,<5"
identify = ">=2.6"
mypy = ">=2.4.0,<3"
hypothesis = ">=6.170.12,<7"
sympy = ">=1.14.0,<2"
python-build = ">=1.6.1,<2"
twine = ">=7.0.0,<8"
pytest = ">=9.1.1,<10"

[tool.pixi.activation.env]
PIP_CONFIG_FILE = "/dev/null"
